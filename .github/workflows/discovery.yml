name: BioShield official public-source discovery
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sync_ted.py'
      - 'bioshield/ted_discovery.py'
      - '.github/workflows/discovery.yml'
permissions:
  contents: write
concurrency:
  group: bioshield-public-source-snapshot
  cancel-in-progress: false
jobs:
  official-ted:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Query official EU TED API (public, no credentials)
        run: PYTHONPATH=. python scripts/sync_ted.py --output data/ted-current.json
      - name: Publish only verified official public notice metadata
        run: |
          git config user.name "bioshield-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ted-current.json
          if git diff --staged --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git commit -m "data(bioshield): official TED source discovery snapshot [skip ci]"
          git push origin HEAD:main
