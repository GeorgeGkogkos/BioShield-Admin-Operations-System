name: BioShield quality gates
on:
  push:
    branches: [main, feature/initial-admin-operations]
  pull_request:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate checked-in browser modules BEFORE TypeScript build
        run: |
          node --input-type=module --check < static/typed/navigation.js
          node --input-type=module --check < static/typed/research-view.js
          node --input-type=module --check < static/typed/location-focus.js
          node --input-type=module --check < static/typed/skeleton.js
          node --input-type=module --check < static/typed/location-focus.js
          node --input-type=module --check < static/typed/skeleton.js
          node --input-type=module --check < static/bioshield-admin.js
      - name: Build and typecheck TypeScript page navigation and research UI
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run build
      - name: Verify BIO-23 safe on-entry discovery cursor
        run: |
          node --input-type=module --check < static/entry-discovery.js
          node --test tests/test_entry_discovery.mjs
      - name: Verify page route transitions never retain previous scroll offset
        run: node --test tests/test_route_scroll.mjs
      - name: Verify restored in-flow fade transitions without app shell animation
        run: node --test tests/test_panel_transitions.mjs
      - name: Verify BIO-30 logo splash only on first session entry or browser refresh
        run: |
          node --check static/splash-init.js
          node --test tests/test_session_splash.mjs
      - name: Validate browser JavaScript syntax
        run: |
          node --input-type=module --check < static/bioshield-admin.js
          node --input-type=module --check < static/real-pilot.js
          node --input-type=module --check < static/app.js
          node --input-type=module --check < static/typed/navigation.js
          node --input-type=module --check < static/typed/research-view.js
      - name: Verify BIO-36 recent individual request rendering
        run: |
          node --input-type=module --check < static/unified-archive.js
          node --test tests/test_recent_individual_results.mjs
      - name: Verify responsive map popup and mobile layout
        run: |
          node --input-type=module --check < static/geographic-map.js
          node --test tests/test_mobile_map.mjs
      - run: python -m pytest -q
      - name: Run TED source-validation regression
        run: python -m pytest -q tests/test_ted_discovery.py
