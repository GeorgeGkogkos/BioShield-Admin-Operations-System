name: BioShield quality gates
on:
  push:
    branches: [main, feature/initial-admin-operations]
  pull_request:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app.py
      - run: python -m pytest -q
      - name: Synthetic qualification and CPU throughput (offline)
        run: python -m bioshield.benchmark --iterations 10000 --output benchmark-results.json --check
      - uses: actions/upload-artifact@v4
        with:
          name: bioshield-synthetic-benchmark
          path: benchmark-results.json
          retention-days: 14
